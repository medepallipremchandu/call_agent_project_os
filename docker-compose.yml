services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talent_os_call_agent
    ports:
      # Host port 5433, not 5432 — avoids clashing with a native/other local
      # Postgres install on the default port. Containers still talk to each
      # other over the internal "postgres:5432" address regardless.
      - "5433:5432"
    volumes:
      - call_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/talent_os_call_agent
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  call_agent_postgres_data:
